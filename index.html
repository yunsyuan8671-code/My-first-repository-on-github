<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFCF6">
<title>富士旅行團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">

<style>
:root{
 --paper:#FFFCF6;--ink:#3E3A39;--pink:#F2A497;
 --yellow:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5;
 --muted:#817a72;--line:3px solid var(--ink);
 --round:26px;--shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
 margin:0;background:var(--paper);color:var(--ink);
 font-family:"Huninn","Noto Sans TC",sans-serif;letter-spacing:.03em
}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}

header{
 position:fixed;inset:0 0 auto;z-index:20;
 background:rgba(255,252,246,.94);
 backdrop-filter:blur(8px);
 border-bottom:3px solid var(--ink)
}
.nav{
 height:68px;display:flex;align-items:center;
 justify-content:space-between;gap:12px
}
.brand{font-size:20px;font-weight:bold;white-space:nowrap}
.brand span{
 display:inline-grid;place-items:center;width:34px;height:34px;
 background:var(--yellow);border:2px solid var(--ink);
 border-radius:50%;margin-right:6px
}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{
 font-size:14px;padding:8px 12px;
 border:2px solid transparent;border-radius:30px;white-space:nowrap
}
nav a:hover{border-color:var(--ink);background:#fff}
main{padding-top:68px}
section{padding:48px 0}
.hero{padding:48px 0 34px}
.hero-card{
 position:relative;overflow:hidden;border:var(--line);
 border-radius:36px;background:#F9EEDB;box-shadow:var(--shadow);
 padding:34px 28px 28px;min-height:390px;
 display:grid;grid-template-columns:1.05fr .95fr;
 align-items:center;gap:12px
}
.eyebrow{
 display:inline-block;background:#fff;border:2px solid var(--ink);
 border-radius:30px;padding:7px 13px;font-size:13px
}
h1{font-size:clamp(38px,7vw,68px);line-height:1.12;margin:18px 0 10px}
h1 em{font-style:normal;color:#C96F62}
.lead{font-size:18px;line-height:1.7;margin:0 0 20px}
.date-pill{
 display:inline-block;background:var(--yellow);border:2px solid var(--ink);
 border-radius:14px;padding:9px 14px;font-size:17px
}
.hero-art{
 width:100%;max-width:440px;justify-self:center;
 animation:float 4s ease-in-out infinite
}
@keyframes float{
 0%,100%{transform:translateY(0) rotate(-1deg)}
 50%{transform:translateY(-9px) rotate(1deg)}
}
.countdown{display:flex;align-items:center;gap:12px;margin-top:20px}
.count-number{
 background:#fff;border:2px solid var(--ink);border-radius:16px;
 padding:9px 14px;min-width:82px;text-align:center;
 box-shadow:3px 3px 0 var(--ink)
}
.count-number strong{display:block;font-size:27px;line-height:1.1}
.count-number small{font-size:12px;color:var(--muted)}

.section-head{
 display:flex;justify-content:space-between;
 align-items:end;gap:12px;margin-bottom:20px
}
.kicker{font-size:13px;color:#9A7767;margin-bottom:4px}
h2{font-size:30px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:5px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{
 border:var(--line);border-radius:var(--round);
 background:#fff;padding:20px;box-shadow:4px 4px 0 var(--ink)
}
.card h3{
 font-size:20px;margin:0 0 14px;
 display:flex;align-items:center;gap:8px
}
.iconbox{
 width:38px;height:38px;border:2px solid var(--ink);
 border-radius:13px;display:grid;place-items:center;font-size:20px
}
.flight-row{
 display:grid;grid-template-columns:1fr auto 1fr;
 align-items:center;gap:8px;padding:14px 0;
 border-top:2px dashed #D8D0C4
}
.flight-row:first-of-type{border-top:0}
.flight-city strong{display:block;font-size:22px}
.flight-city small,.muted{font-size:13px;color:var(--muted)}
.plane{font-size:25px;text-align:center}
.info-line{
 display:flex;justify-content:space-between;gap:10px;
 padding:9px 0;border-bottom:1px dashed #ddd5ca
}
.info-line:last-child{border:0}
.info-line span:first-child{color:var(--muted)}
.placeholder{
 display:inline-block;background:#FFF3D5;
 border:1.5px dashed #B78D42;border-radius:9px;
 padding:5px 9px;font-size:13px;color:#80652F
}

/* 住宿卡片 */
.stay-grid{
 display:grid;grid-template-columns:repeat(3,1fr);gap:18px
}
.stay-card{
 background:#F2F8FB;display:flex;flex-direction:column;
 min-width:0
}
.stay-card:nth-child(2){background:#FDF5E7}
.stay-card:nth-child(3){background:#F4F8EF}
.stay-date{
 display:inline-block;background:#fff;border:2px solid var(--ink);
 border-radius:12px;padding:7px 11px;font-size:14px;
 margin-bottom:14px;width:fit-content
}
.stay-illustration{
 width:100%;height:100px;display:block;margin-bottom:12px
}
.stay-name{font-size:23px;font-weight:bold;margin:0 0 5px}
.stay-location{font-size:13px;color:var(--muted);margin-bottom:14px}
.stay-detail{
 background:rgba(255,255
